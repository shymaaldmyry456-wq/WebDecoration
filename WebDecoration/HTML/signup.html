<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Decor Company</title>
    <link rel="icon" href="../images/furniture.png" sizes="180x180">
    <link rel="stylesheet" href="../CSS/signup.css">
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <p>Please fill in the form to create an account</p>
        <form id="form">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email" autofocus>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">

            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" required placeholder="Enter a password" minlength="8" maxlength="20">
            
            <label for="birth">Birthdate:</label>
            <input type="date" id="birth" name="birth" required>

            <label>Gender:</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="male" checked> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
            </div>

            <label for="governorate">Governorate:</label>
            <select id="governorate" name="governorate" required>
                <option value="" disabled selected>Select your governorate</option>
                <option>Cairo</option>
                <option>Giza</option>
                <option>Alexandria</option>
                <option>Aswan</option>
                <option>Asyut</option>
                <option>Beheira</option>
                <option>Beni Suef</option>
                <option>Dakahlia</option>
                <option>Damietta</option>
                <option>Faiyum</option>
                <option>Gharbia</option>
                <option>Ismailia</option>
                <option>Kafr El Sheikh</option>
                <option>Luxor</option>
                <option>Matruh</option>
                <option>Minya</option>
                <option>Monufia</option>
                <option>New Valley</option>
                <option>North Sinai</option>
                <option>Port Said</option>
                <option>Qalyubia</option>
                <option>Qena</option>
                <option>Red Sea</option>
                <option>Sharqia</option>
                <option>Sohag</option>
                <option>South Sinai</option>
                <option>Suez</option>
            </select>

            <p>Already have an account? <a href="./login.html">Login here</a></p>

            <div class="buttons">
                <input type="submit" value="Sign Up">
                <input type="reset" value="Reset">
            </div>
        </form>
        
        <!-- Messages to display error or success -->
        <p id="registerMessage" class="message" style="display:none;"></p>
        <p id="loginMessage" class="message" style="display:none;"></p>
    </div>
    
    <script >
        let users = JSON.parse(localStorage.getItem('users')) || [];

    function saveUsers() {
      localStorage.setItem('users', JSON.stringify(users));
    }

    function register(email,username,  password) {
      const existingUser = users.find(user => user.password===password || user.email === email);
      if (existingUser) {
        if (existingUser.email=== email) {
          return { success: false, message: "⚠️ Wrong email !" };
        } else {
          return { success: false, message: "⚠️Wrong password !" };
        }
      }

      const newUser = {
        id: users.length + 1,
        email,
        password,
        createdAt: new Date()
      };
      users.push(newUser);
      saveUsers();
      return { success: true, message: "✅ Successfully regisreration ! ", userId: newUser.id };
    }

    function showMessage(id, message, isSuccess) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = isSuccess ? '✅ message success' : '⚠️ message error';
      el.style.display = 'block';
      setTimeout(() => {
        el.style.display = 'none';
      }, 5000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('form').addEventListener('submit', event => {
        event.preventDefault();
        const username = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('pass').value.trim();

        if (!username || !email || !password) {
          alert( "⚠️ All fields required !");
          return;
        }

        const result = register(email, username, password);
        showMessage('registerMessage', result.message, result.success);

        if (result.success) {
          document.getElementById('name').value = '';
          document.getElementById('email').value = '';
          document.getElementById('pass').value = '';
        }
      });
    });

    </script>
</body>
</html>
